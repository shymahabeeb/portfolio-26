name: Deploy site

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout staging (preview site)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: site/staging

      - name: Remove git and workflow folders from the published files
        run: rm -rf site/.git site/.github site/staging/.git site/staging/.github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
